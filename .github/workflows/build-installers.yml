name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-windows.lock
            requirements-packaging.txt
      - name: Create packaging virtual environment
        shell: pwsh
        run: |
          python -m venv .runtime/venv
          $Python = ".\.runtime\venv\Scripts\python.exe"
          & $Python -m pip install --upgrade pip setuptools wheel
      - name: Install CPU PyTorch
        shell: pwsh
        run: |
          $Python = ".\.runtime\venv\Scripts\python.exe"
          & $Python -m pip install --index-url https://download.pytorch.org/whl/cpu `
            "torch==2.11.0" "torchaudio==2.11.0"
      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          $Python = ".\.runtime\venv\Scripts\python.exe"
          & $Python -m pip install -c requirements-windows.lock `
            ".[ring-opus,asr-streaming-sensevoice,asr-funasr-nano,asr-volcengine,ui]" `
            -r requirements-packaging.txt
      - name: Install Windows Opus runtime
        shell: pwsh
        run: ./scripts/install-opus-runtime.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -SkipDependencyInstall
      - uses: actions/upload-artifact@v4
        with:
          name: ProximicVoice-windows-x64
          path: dist/installer/*.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          for variable in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_NOTARY_APPLE_ID \
            APPLE_NOTARY_TEAM_ID \
            APPLE_NOTARY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required GitHub Actions secret: $variable" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/proximic-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/proximic-developer-id.p12"
          if [[ -z "$KEYCHAIN_PASSWORD" ]]; then
            KEYCHAIN_PASSWORD="proximic-ci-keychain"
          fi
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          security default-keychain -d user -s "$SIGNING_KEYCHAIN"
      - name: Configure Apple notarization
        if: ${{ secrets.APPLE_NOTARY_APPLE_ID != '' }}
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials proximic-notary \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD"
      - name: Build Apple Silicon app and DMG
        env:
          PROXIMIC_PYTHON: python3.11
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_APPLE_ID != '' && 'proximic-notary' || '' }}
          PROXIMIC_REQUIRE_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bash ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ProximicVoice-macos-arm64
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            release_flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" release-assets/* "${release_flags[@]}"
          fi
