[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proximic-ring"
version = "0.6.0"
description = "Near-field streaming voice input for Ringo, ProxiMic and pluggable ASR backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "torch>=2.11,<2.12",
]

[project.optional-dependencies]
ring = ["bleak>=3.0.1"]
ring-opus = ["bleak>=3.0.1", "opuslib>=3.0.1"]
mic = ["sounddevice>=0.5.3"]
asr = ["funasr>=1.3.26", "modelscope", "huggingface_hub", "numpy<=1.26.4"]
asr-sensevoice = ["funasr>=1.3.26", "modelscope", "huggingface_hub", "numpy<=1.26.4"]
asr-streaming-sensevoice = ["funasr>=1.3.26", "modelscope", "huggingface_hub", "asr-decoder", "online-fbank", "torchaudio>=2.11,<2.12", "numpy<=1.26.4"]
asr-funasr-nano = ["torch>=2.11,<2.12", "funasr>=1.3.26", "transformers>=4.51.3", "torchaudio>=2.11,<2.12", "zhconv", "whisper_normalizer", "pyopenjtalk-plus", "numpy<=1.26.4"]
asr-whisper = ["faster-whisper>=1.1.0"]
asr-http = ["requests>=2.31"]
asr-volcengine = ["websocket-client>=1.8"]
ui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8.0"]
all = ["bleak>=3.0.1", "opuslib>=3.0.1", "sounddevice>=0.5.3", "funasr>=1.3.26", "modelscope", "huggingface_hub", "asr-decoder", "online-fbank", "transformers>=4.51.3", "torchaudio>=2.11,<2.12", "zhconv", "whisper_normalizer", "pyopenjtalk-plus", "numpy<=1.26.4", "faster-whisper>=1.1.0", "requests>=2.31", "websocket-client>=1.8", "PySide6>=6.8,<7", "pytest>=8.0"]

[project.scripts]
proximic-ring = "proximic_ring.cli:main"
proximic-ring-ui = "proximic_ring.ui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proximic_ring = ["assets/*.model", "assets/*.json", "assets/*.npy", "ui/qml/*.qml", "ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
